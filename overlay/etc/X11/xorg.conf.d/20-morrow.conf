# X's input configuration for Morrow.
#
# Without this, X falls back to guessing: it probes for a mouse that has three buttons and a wheel
# and treats a trackpad as one, which on a laptop is how you get a cursor that jumps while you
# type. libinput's own defaults are the sane behaviour the desktop expects, so the section only
# has to say which devices it should own.

Section "InputClass"
    Identifier "morrow-libinput"
    Driver "libinput"
    MatchIsPointer "on"
    MatchIsKeyboard "on"
    MatchIsTouchpad "on"
    MatchIsTouchscreen "on"
EndSection
